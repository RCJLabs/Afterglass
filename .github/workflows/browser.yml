name: Browser

# The browser checks (prototype/e2e, round seven, phase 6): the page itself in Chromium, at phone and desktop
# sizes. Kept apart from Test and Pages, so a check that runs long doesn't hold up a deploy; a failure here is
# still a failure to fix.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        working-directory: prototype
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run the browser checks
        working-directory: prototype
        run: npm run e2e
      # Round seven, phase 19: the site as Pages publishes it, the season bundled into one script, checked too.
      - name: Build the site as Pages does
        run: node prototype/tools/site.mjs --src . --out /tmp/site --channel release --build "${GITHUB_SHA::7}"
      - name: Run the browser checks on the bundled page
        working-directory: prototype
        env:
          E2E_ROOT: /tmp/site/prototype
        run: node e2e/run.mjs crash dev hall campaign update taps
      - name: Keep the screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shots
          path: /tmp/afterglass-e2e/shots
          if-no-files-found: ignore
