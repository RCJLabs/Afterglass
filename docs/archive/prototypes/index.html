<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afterglass Greybox</title>
<link rel="stylesheet" href="../../../prototype/fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hud" id="hud"></header>
<main class="wrap" id="app">
  <div class="layout">
    <div class="col">
      <section class="phase" id="phase" aria-label="Current phase"></section>
      <section class="keep" id="keep" aria-label="The keep by day and by night"></section>
    </div>
    <div class="col">
      <div class="rosters" id="rosters"></div>
      <section class="records" id="records" aria-label="Records"></section>
    </div>
  </div>
  <noscript><p>This greybox needs JavaScript.</p></noscript>
</main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="src/ui.js"></script>
</body>
</html>
