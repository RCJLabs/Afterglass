<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afterglass Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Spline+Sans+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="night.css">
</head>
<body>
<header class="hud" id="hud"></header>
<main class="wrap" id="app">
  <div class="night-layout">
    <section class="stage-card" aria-label="The Tain at night">
      <div class="toolbar" id="tools"></div>
      <div class="stage-box" id="stage-box"><canvas id="stage" aria-label="Side view of the Tain: five floors of rooms between the Veil at the top and the Deep at the bottom. Candles, shades and Creepers are drawn as simple shapes."></canvas></div>
      <p class="hint" id="stage-hint"></p>
    </section>
    <div class="col">
      <section class="phase" id="phase" aria-label="Current phase"></section>
      <section class="roster dead" id="shades" aria-label="Shades"></section>
    </div>
    <section class="records" id="records" aria-label="Records"></section>
  </div>
  <noscript><p>This greybox needs JavaScript.</p></noscript>
</main>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script type="module" src="src/night-ui.js"></script>
</body>
</html>
