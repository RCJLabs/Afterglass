<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0b18">
<title>Afterglass Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Spline+Sans+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="night.css">
<link rel="stylesheet" href="season.css">
</head>
<body class="game-page">
<div class="game" id="game">
  <canvas id="stage" aria-label="The castle. By day the keep stands on its lake with the living at work in eight rooms. By night the Tain, the keep's reflection under the Veil, holds the shades, the candles and the Unlit."></canvas>
  <div class="glabels" id="labels" aria-hidden="true"></div>
  <header class="ghud" id="hud"></header>
  <p class="ghint" id="stage-hint"></p>
  <div class="gzoom" id="zoom" role="group" aria-label="Zoom">
    <button class="btn sm" id="zoom-in" data-act="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
    <button class="btn sm" id="zoom-out" data-act="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
    <button class="btn sm" id="zoom-fit" data-act="zoom-fit" aria-label="Fit the castle" title="Fit the castle (0)" disabled>Fit</button>
  </div>
  <nav class="gbar" id="bar" aria-label="Tools and panels"></nav>
  <aside class="gsheet" id="sheet" hidden aria-labelledby="sheet-title"></aside>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="ghint">This prototype needs JavaScript.</p></noscript>
</div>
<script type="module" src="src/slice-ui.js"></script>
</body>
</html>
