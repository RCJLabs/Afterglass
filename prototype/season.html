<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0b18">
<!-- Round seven: the page runs only its own code, and imported files can't bring any of their own. Styles
     allow inline attributes (the panels set sizes and colours with them); pictures allow data: and blob: (the
     night's stills and the recap card). Since phase 19 the fonts are the game's own, so nothing comes from
     anywhere else. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'">
<title>Afterglass Season</title>
<link rel="manifest" href="season.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Afterglass">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="night.css">
<link rel="stylesheet" href="season.css">
</head>
<body class="game-page">
<div class="game" id="game">
  <canvas id="stage" aria-label="The castle. By day the keep stands on its lake with the living at work in eight rooms. By night the Tain, the keep's reflection under the Veil, holds the shades, the candles and the Unlit."></canvas>
  <div class="glabels" id="labels" aria-hidden="true"></div>
  <header class="ghud" id="hud"></header>
  <p class="ghint" id="stage-hint" aria-live="polite"></p>
  <p class="visually-hidden" id="sr-status" aria-live="polite"></p>
  <div class="gcoach" id="coach" role="status" aria-live="polite" hidden></div>
  <div class="gzoom" id="zoom" role="group" aria-label="Zoom">
    <button class="btn sm" id="zoom-in" data-act="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
    <button class="btn sm" id="zoom-out" data-act="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
    <button class="btn sm" id="zoom-fit" data-act="zoom-fit" aria-label="Fit the castle" title="Fit the castle (0)" disabled>Fit</button>
  </div>
  <nav class="gbar" id="bar" aria-label="Tools and panels"></nav>
  <section class="gtitle" id="title" hidden aria-labelledby="title-name"></section>
  <aside class="gsheet" id="sheet" hidden aria-labelledby="sheet-title"></aside>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="ghint">This prototype needs JavaScript.</p></noscript>
</div>
<script type="module" src="src/slice-ui.js"></script>
</body>
</html>
